{% extends "base.html" %}

{% block title %}Vigil - Log In{% endblock %}

{% block content %}
    <div class="card card-narrow">
        <h1>Log In to Vigil</h1>
        <p>Enter your credentials to authenticate against <code>vigil_db</code>.</p>

        <form action="{{ url_for('main.login') }}" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" required placeholder="admin" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-block">Log In</button>
        </form>
    </div>
{% endblock %}
